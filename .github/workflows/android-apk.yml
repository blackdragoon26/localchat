name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android NDK and build liblocalchat.so (arm64-v8a)
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [[ -z "$NDK_ROOT" || ! -d "$NDK_ROOT" ]]; then
            NDK_ROOT="$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$NDK_ROOT" || ! -d "$NDK_ROOT" ]]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_ROOT="${ANDROID_HOME}/ndk/26.3.11579264"
          fi
          CC_BIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "Using NDK clang: $CC_BIN"

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$CC_BIN" \
            CGO_LDFLAGS="-Wl,-z,max-page-size=16384" \
            go build -buildmode=pie -trimpath -ldflags="-s -w" \
            -o android/app/src/main/jniLibs/arm64-v8a/liblocalchat.so ./cmd/localchat
          ls -lh android/app/src/main/jniLibs/arm64-v8a/liblocalchat.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename and upload APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LocalChat-arm64.apk
          ls -lh LocalChat-arm64.apk

      - name: Upload LocalChat-arm64.apk
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat-arm64-apk
          path: LocalChat-arm64.apk
          if-no-files-found: error
